<!DOCTYPE html>
<html lang="ar" dir="rtl" data-i18n-page data-rtl data-title-key="title.404">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#000000">
    <title>Page not found - Tickwell</title>

    <link rel="icon" type="image/png" href="/brain.png">

    <script src="/consent.js"></script>
    <script src="/settings.js"></script>

    <link rel="stylesheet" href="/style.css">

    <style>
        .nf {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 24px;
            text-align: center;
            font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
        }

        .nf img { width: 72px; height: 72px; }

        .nf .code {
            font-family: "Tickwell Timer", Impact, "Arial Narrow", sans-serif;
            font-size: clamp(80px, 26vw, 180px);
            line-height: 1;
        }

        .nf h1 { margin: 0; font-size: 26px; }
        .nf p { margin: 0 0 14px; opacity: 0.75; }

        .nf a {
            padding: 12px 26px;
            border-radius: 12px;
            background: white;
            color: black;
            font-weight: bold;
            text-decoration: none;
        }

        body.light-mode .nf a { background: black; color: white; }
    </style>
</head>

<body>

    <main class="nf">

        <img src="/brain.png" alt="Tickwell">

        <div class="code" aria-hidden="true">404</div>

        <h1 data-i18n="e404.title">الصفحة غير موجودة</h1>

        <p data-i18n="e404.text">الرابط الذي فتحته غير موجود أو تم نقله.</p>

        <a href="/" data-i18n="e404.home">العودة للرئيسية</a>

    </main>

</body>
</html>
