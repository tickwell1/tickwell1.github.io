<!DOCTYPE html>
<html lang="en" data-i18n-page>

<head>
    <link rel="canonical" href="https://tickwell1.github.io/">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5FERLLMF79"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-5FERLLMF79');
    </script>
    <meta name="google-site-verification" content="UVkdKxEYHDcF2PPXxmQgQDTb6QHR9PxSx6GpxJpBNoA" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Tickwell - مؤقت مذاكرة مجاني يساعدك على التركيز وتنظيم وقت الدراسة باستخدام عداد بسيط وسريع لجلسات المذاكرة، مناسب للطلاب والعمل والدراسة اليومية.">

    <meta name="keywords" content="study, timer, Tickwell, well, Study Hours Tracker">

    <meta name="author" content="Hesham Khaled">

    <title>Tickwell - study with timer</title>

    <link rel="icon" type="image/png" sizes="192x192" href="/brain-192.png">

    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Tickwell">

    <script src="./settings.js"></script>

    <link rel="stylesheet" href="./style.css">

</head>


<body>

    <!-- Tickwell Menu -->
    <div class="menu-container">

        <button
            class="menu-button"
            id="menuButton"
            aria-label="فتح القائمة" data-i18n-aria="menu.open"
            aria-expanded="false"
        >
            <span class="arrow">▼</span>
        </button>

        <nav class="dropdown-menu" id="dropdownMenu">

            <a href="index.html" data-i18n="menu.home">Home</a>

            <a href="dashboard.html" data-i18n="menu.dashboard">Dashboard</a>

            <a href="settings.html" data-i18n="menu.settings">Settings</a>

            <a href="about.html" data-i18n="menu.about">About Tickwell</a>

            <a href="how-to-use.html" data-i18n="menu.howto">How to Use</a>

            <a href="privacy.html" data-i18n="menu.privacy">Privacy Policy</a>

            <a href="contact.html" data-i18n="menu.contact">Contact</a>

        </nav>

    </div>

    


    <header>

        <img
            src="./brain.png"
            alt="Tickwell"
            class="image"
        >

    </header>


    <!-- Timer Mode -->
    <div class="mode-wrap">

        <div
            class="mode-switch"
            id="modeSwitch"
            role="group"
            aria-label="وضع المؤقت" data-i18n-aria="mode.group"
        >
            <span class="mode-indicator" aria-hidden="true"></span>

            <button
                type="button"
                class="mode-btn active"
                data-mode="stopwatch"
                aria-pressed="true"
                data-i18n="mode.stopwatch"
            >
                ساعة إيقاف
            </button>

            <button
                type="button"
                class="mode-btn"
                data-mode="pomodoro"
                aria-pressed="false"
                data-i18n="mode.pomodoro"
            >
                بومودورو
            </button>
        </div>

    </div>


    <!-- Pomodoro Info -->
    <div class="pomo-info" id="pomoInfo" data-phase="focus">

        <div class="pomo-label" id="pomoLabel">تركيز</div>

        <div class="pomo-dots" id="pomoDots"></div>

    </div>


    <div class="timer">00:00:00</div>


    <div class="buttons">

        <button
            class="thems"
            title="تغيير الوضع" data-i18n-title="theme.title"
        >
            ☀️
        </button>


        <button
            class="fall"
            title="ملء الشاشة" data-i18n-title="fullscreen.title"
        >
            ⛶
        </button>


        <button class="reset" data-i18n="reset">
            إعادة الضبط
        </button>


        <button class="start">
            ابدأ
        </button>

    </div>


    <!-- Keyboard Shortcuts -->
    <button
        type="button"
        class="help-button"
        id="helpButton"
        aria-label="اختصارات لوحة المفاتيح"
        data-i18n-aria="sc.title"
    >
        ⌨
    </button>


    <div
        class="shortcuts-help"
        id="shortcutsHelp"
        role="dialog"
        aria-modal="true"
        aria-labelledby="shortcutsTitle"
    >

        <div class="shortcuts-panel">

            <h2 id="shortcutsTitle" data-i18n="sc.title">اختصارات لوحة المفاتيح</h2>

            <ul class="shortcuts-list">
                <li><span data-i18n="sc.start">ابدأ / إيقاف</span><kbd>Space</kbd></li>
                <li><span data-i18n="sc.reset">إعادة الضبط</span><span><kbd>Shift</kbd> + <kbd>R</kbd></span></li>
                <li><span data-i18n="sc.fullscreen">ملء الشاشة</span><kbd>F</kbd></li>
                <li><span data-i18n="sc.theme">تغيير الوضع (فاتح / داكن)</span><kbd>T</kbd></li>
                <li><span data-i18n="sc.mode">ساعة إيقاف / بومودورو</span><kbd>M</kbd></li>
                <li><span data-i18n="sc.help">عرض هذه القائمة</span><kbd>?</kbd></li>
            </ul>

            <button type="button" class="shortcuts-close" id="shortcutsClose" data-i18n="sc.close">إغلاق</button>

        </div>

    </div>


    <div class="toast" id="toast" role="status" aria-live="polite"></div>


    <script src="./stats.js"></script>

    <script src="./script.js"></script>

    <script type="module" src="./auth.js"></script>

</body>

</html>
